<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>오늘 일정</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="base.css">
<style>
body { padding: 14px; }
.w {
  border-radius: 22px; border: none;
  box-shadow: 0 6px 14px rgba(70, 60, 150, .16);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
  font-family: var(--memo-font); cursor: grab;
  animation: pop .5s var(--ease);
  transition: opacity .32s var(--ease), transform .4s var(--ease), background .6s ease;
}
.w:active { cursor: grabbing; }
.w.leaving { opacity: 0; transform: translateY(10px) scale(.92); }
.top { display: flex; align-items: baseline; gap: 8px; font-family: var(--ui); }
.top, .ev, .t { font-family: var(--cal-font) !important; }
.big { font-size: calc(34px * var(--cs, 1)); font-weight: 700; line-height: 1; color: var(--a1); }
.mon { font-size: calc(12px * var(--cs, 1)); font-weight: 600; letter-spacing: 1px; color: var(--a1); }
.sub { font-size: calc(12px * var(--cs, 1)); color: var(--sub); }
.ev { display: flex; align-items: center; gap: 10px; font-size: calc(14px * var(--cs, 1)); animation: fade .4s var(--ease); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.t { font-size: calc(12px * var(--cs, 1)); color: var(--sub); width: calc(40px * max(1, var(--cs, 1))); flex: none; font-family: var(--ui); }
.n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.none { font-size: 13px; color: var(--sub); }
/* 말랑 드로잉 스킨 */
html.draw .w { background: #FBFAF5 !important; box-shadow: inset 0 0 0 2.2px #161616, 0 2px 5px rgba(0, 0, 0, .10); border-radius: 16px; }
html.draw .big, html.draw .mon { color: #161616; }
html.draw .ev { border-bottom: 1.6px solid #161616; padding-bottom: 6px; }
html.draw .dot { background: #161616 !important; }
</style>
</head>
<body>
<div id="w" class="w" title="끌어서 옮길 수 있어요">
  <div class="top">
    <div id="big" class="big"></div>
    <div><div id="mon" class="mon"></div><div id="sub" class="sub"></div></div>
  </div>
  <div id="list"></div>
</div>
<script src="common.js"></script>
<script src="widget.js"></script>
</body>
</html>
