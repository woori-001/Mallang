<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>연락망</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="table.css">
<link rel="stylesheet" href="people.css">
</head>
<body>
<div id="card" class="card enter">
  <div id="head" class="head" title="끌어서 옮기기 · 더블클릭하면 접기/펴기">
    <button id="fold" class="ib fold" type="button" aria-label="접기" aria-expanded="true" title="접기 (제목줄 더블클릭)"></button>
    <span id="hIcon" class="hIcon" aria-hidden="true"></span>
    <span class="htitle">연락망</span>
    <label class="search">
      <span id="sIcon" aria-hidden="true"></span><span class="sr">연락망 검색</span>
      <input id="q" type="text" placeholder="이름 · 부서 · 번호" spellcheck="false">
    </label>
    <button id="edit" class="ib txt" type="button" aria-pressed="false" title="칸 고치기">편집</button>
    <button id="top" class="ib" type="button" aria-pressed="false" title="항상 위에 두기"></button>
    <button id="close" class="ib" type="button" aria-label="닫기" title="닫기 (목록바 연락망 탭에서 다시 띄울 수 있어요)"></button>
  </div>
  <div id="gv" class="gvBox"></div>
  <div id="tbl" class="tbl" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="grip" class="grip" title="크기 조절" aria-hidden="true"></div>
</div>
<script src="common.js"></script>
<script src="people.js"></script>
</body>
</html>
