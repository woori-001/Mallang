<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>메모</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="table.css">
<link rel="stylesheet" href="memo.css">
</head>
<body>
<div id="card" class="card enter">
  <div id="head" class="head">
    <button id="fold" class="ib fold" type="button" aria-label="접기" title="접기 (제목줄 더블클릭)"></button>
    <span id="grpDot" class="grpDot" hidden></span>
    <span id="markIcon" class="markIcon"></span>
    <input id="title" class="title" type="text" readonly spellcheck="false" aria-label="메모 제목" maxlength="80">
    <span id="clipBadge" class="clipBadge" hidden aria-hidden="true"></span>
    <span id="copied" class="copied" role="status" aria-live="polite"></span>
    <button id="hNew" class="ib more hnew" type="button" aria-label="새 메모" title="새 메모 (Ctrl+N)"></button>
    <button id="more" class="ib more" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="tools" title="메뉴"></button>
  </div>
  <div id="tools" class="tools" role="toolbar" aria-label="메모 도구" hidden>
      <button id="bMark" class="ib" type="button" aria-label="중요 표시와 색" title="중요 표시 · 메모 색"></button>
      <button id="bType" class="ib" type="button" aria-label="체크리스트 전환" title="체크리스트 ↔ 일반 메모"></button>
      <button id="bTable" class="ib" type="button" aria-label="표 전환" title="표 ↔ 일반 메모"></button>
      <button id="bGroup" class="ib" type="button" aria-label="그룹" title="그룹 (함께 옮기고 함께 숨기기)"></button>
      <button id="bUnsplit" class="ib" type="button" aria-label="분리 되돌리기" title="원래 메모로 되돌리기 (분리 취소)" hidden></button>
      <button id="bSplit" class="ib" type="button" aria-label="고른 부분을 새 메모로 분리" title="드래그한 부분을 새 메모로 분리"></button>
      <button id="bDiv" class="ib" type="button" aria-label="구분선 넣기" title="구분선 넣기 (Ctrl+Enter)"></button>
      <button id="bTop" class="ib" type="button" aria-label="맨 앞으로" title="맨 앞 (항상 위)"></button>
      <button id="bBottom" class="ib" type="button" aria-label="맨 뒤로" title="맨 뒤 (창 아래로)"></button>
      <button id="bHide" class="ib" type="button" aria-label="숨기기" title="숨기기 (목록에서 다시 보이기)"></button>
      <button id="bDel" class="ib del" type="button" aria-label="삭제" title="삭제"></button>
  </div>

  <div id="picker" class="picker" hidden>
    <div class="plabel">기호</div>
    <div id="pMarks" class="prow"></div>
    <div class="plabel">기호 색</div>
    <div id="pColors" class="prow"></div>
    <div class="plabel">메모 색</div>
    <div id="pSlots" class="prow"></div>
  </div>

  <div id="gpicker" class="picker gpicker" hidden>
    <div class="plabel">그룹 — 같은 그룹 메모는 함께 옮겨지고 함께 숨겨져요</div>
    <div id="gList" class="glist"></div>
    <form id="gNew" class="gnew"><input id="gName" type="text" maxlength="40" placeholder="새 그룹 이름" spellcheck="false"><button type="submit" class="gadd">만들기</button></form>
  </div>

  <div id="findBar" class="findBar" hidden role="search">
    <input id="findQ" type="text" placeholder="메모에서 찾기" spellcheck="false" aria-label="메모에서 찾기">
    <span id="findN" class="findN"></span>
    <button id="findPrev" class="ib" type="button" aria-label="이전" title="이전 (Shift+Enter)"></button>
    <button id="findNext" class="ib" type="button" aria-label="다음" title="다음 (Enter)"></button>
    <button id="findX" class="ib" type="button" aria-label="찾기 닫기" title="닫기 (Esc)"></button>
  </div>

  <div id="body" class="body">
    <div id="text" class="text" data-placeholder="여기에 바로 입력 · Ctrl+Enter 구분선" aria-label="메모 내용"></div>
    <div id="tbl" class="tblArea" hidden></div>
    <div id="checks" class="checks" hidden>
      <div id="items"></div>
      <button id="addItem" class="addItem" type="button"></button>
    </div>
  </div>
  <div id="chip" class="chip" hidden></div>
  <button id="splitChip" class="splitChip" type="button" hidden></button>
  <button id="undoChip" class="undoChip" type="button" hidden></button>
  <div id="hint" class="hint" role="status" aria-live="polite"></div>
  <div id="confirm" class="confirm" hidden role="alertdialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cDesc">
    <div class="cbox">
      <div id="cTitle" class="ctitle">이 메모를 삭제할까요?</div>
      <div id="cDesc" class="cdesc">휴지통에서 7일 동안 되살릴 수 있어요.</div>
      <div class="cbtns">
        <button id="cNo" class="cno" type="button">취소</button>
        <button id="cYes" class="cyes" type="button">삭제</button>
      </div>
    </div>
  </div>
  <div id="grip" class="grip" title="크기 조절" aria-hidden="true"></div>
</div>
<script src="common.js"></script>
<script src="memo.js"></script>
</body>
</html>
