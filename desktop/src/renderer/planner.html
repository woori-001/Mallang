<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>주간 플래너</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="planner.css">
</head>
<body>
<div id="slider" class="slider">
<button id="ltab" class="tab" type="button" aria-label="메모 목록 열기" title="메모 목록">
  <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M8.5 1.5v9L2.5 6z" fill="currentColor"/></svg>
</button>
<button id="ptab" class="tab ptab on" type="button" aria-label="주간 플래너 접기" title="주간 플래너 접기">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M12 14h2M16 14h2M8 18h2M12 18h2"/></svg>
</button>
<div id="pl" class="pl">
  <div id="hd" class="hd">
    <span class="bun"><img src="bunny.png" data-bun="bunny.png" alt="" draggable="false"></span>
    <div class="ttl">
      <div class="t1"><span id="label" class="label"></span><span class="beta">베타</span></div>
      <div id="range" class="range"></div>
    </div>
    <div class="nav">
      <button id="prev" class="pb" type="button" aria-label="지난 주"></button>
      <button id="today" class="pb txt" type="button">이번 주</button>
      <button id="next" class="pb" type="button" aria-label="다음 주"></button>
    </div>
    <div class="tools">
      <button id="tTape" class="pb txt" type="button" title="연속 일정에 마스킹테이프 붙이기">🎀 테이프</button>
      <button id="tSticker" class="pb txt" type="button" title="이모지 스티커 붙이기">🌷 스티커</button>
      <button id="tSet" class="pb txt" type="button" title="기준 시간 · 투명도">⚙️ 설정</button>
      <button id="close" class="pb" type="button" aria-label="플래너 접기" title="접기 (Esc)"></button>
    </div>
  </div>

  <div id="sheet" class="sheet">
    <aside class="side">
      <section class="card">
        <div class="ch">이번 주 근무</div>
        <div id="sum" class="sum"></div>
      </section>
      <section class="card grow">
        <div class="ch">메모</div>
        <textarea id="notes" class="notes" spellcheck="false" placeholder="이번 주에 기억할 것"></textarea>
      </section>
    </aside>
    <div id="cols" class="row"></div>
    <div id="heads" class="row"></div>
    <div id="times" class="row"></div>
    <div id="lane" class="lane" title="날짜를 가로로 끌면 테이프를 붙일 수 있어요"></div>
    <div id="lists" class="row"></div>
    <div id="stk" class="stk"></div>
  </div>
  <div id="hint" class="hint" hidden></div>
</div>
</div>
<div id="pop" class="pop" hidden></div>
<script src="common.js"></script>
<script src="planner.js"></script>
</body>
</html>
