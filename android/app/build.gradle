plugins { id 'com.android.application' }

// 테스트용 앱: 버전 번호는 빌드할 때 GitHub 실행 번호로 올라감
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.woori.mallang'
    compileSdk 34
    defaultConfig {
        applicationId 'com.woori.mallang'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "0.1.${runNo}"
        // 안드로이드 코드 지문: 위젯·앱 코드가 실제로 바뀐 빌드만 "새 버전" 알림을 띄우려고 (웹앱만 바뀐 빌드는 알림 안 함)
        buildConfigField 'String', 'SRC_HASH', "\"${System.getenv('SRC_HASH') ?: 'dev'}\""
    }
    buildFeatures { buildConfig true }
    // 서명: 빌드 서버가 보관해 둔 같은 키로 (그래야 새 APK를 지우지 않고 덮어 설치 가능)
    def ks = System.getenv('MALLANG_KEYSTORE')
    signingConfigs {
        if (ks) {
            mallang {
                storeFile file(ks)
                storePassword 'mallangtest'
                keyAlias 'mallang'
                keyPassword 'mallangtest'
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ''
            if (ks) signingConfig signingConfigs.mallang
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
