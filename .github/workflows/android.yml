# 말랑메모 안드로이드 앱(테스트용, 홈 화면 달력 위젯 포함) APK를 만들어 'android-test' 미리보기 릴리스에 올립니다.
# PC 자동 업데이트는 '최신(Latest)' 릴리스만 보니까, 미리보기(pre-release)인 이 릴리스와 섞이지 않아요.
name: 안드로이드 앱 빌드 (테스트)

on:
  push:
    branches: [main]
    paths: ['android/**', 'docs/app.js', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # 서명 키를 계속 같은 걸로 써야 새 APK를 지우지 않고 덮어 설치할 수 있어서, 처음 만든 키를 GitHub 보관함에 보관해 둠
      # (예전 설정은 보관이 실제로 안 되고 있었음: 키 파일 자리가 달라서 매번 새 키였음 → 직접 만든 키 파일로 고침)
      - name: 서명 키 가져오기
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/mallang-sign/mallang.jks
          key: mallang-android-sign-v2
      - name: 서명 키 확인 (처음 한 번만 만들기)
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          if [ -f android/SIGNING_KEY_CREATED ]; then
            echo "::error::보관해 둔 서명 키를 찾지 못했어요. 새 키로 만들면 휴대폰에 덮어 설치가 안 돼서 멈춥니다."
            exit 1
          fi
          mkdir -p ~/mallang-sign
          keytool -genkeypair -keystore ~/mallang-sign/mallang.jks -storepass mallangtest -keypass mallangtest -alias mallang \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mallang Memo Test, O=woori, C=KR"
      - name: 서명 키 지문
        run: keytool -list -keystore ~/mallang-sign/mallang.jks -storepass mallangtest | grep -i "SHA-256" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK 만들기
        working-directory: android
        run: |
          set -o pipefail
          # 안드로이드 코드 지문 (앱 안 "새 버전" 알림은 이 값이 바뀐 빌드만)
          export SRC_HASH=$(git ls-files -s app/src app/build.gradle | sha1sum | cut -c1-12)
          export MALLANG_KEYSTORE=$HOME/mallang-sign/mallang.jks
          echo "SRC_HASH=$SRC_HASH" >> "$GITHUB_ENV"
          gradle --no-daemon assembleDebug 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../MallangMemo-android-test.apk
          ls -la ../MallangMemo-android-test.apk
      - name: 미리보기 릴리스에 올리기
        run: |
          if gh release view android-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-test MallangMemo-android-test.apk --repo "$GITHUB_REPOSITORY" --clobber
            # APK 를 다 올린 뒤에 버전 표시를 바꿈 (앱이 새 버전을 보고 받으러 갔을 때 옛 APK 를 받지 않게)
            printf '{"code":%s,"src":"%s","at":"%s"}' "$GITHUB_RUN_NUMBER" "$SRC_HASH" "$(date -u +%FT%TZ)" > android-version.json
            gh release upload android-test android-version.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit android-test --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes "안드로이드 테스트 앱 (홈 화면 달력 위젯). 빌드 #${GITHUB_RUN_NUMBER}"
          else
            gh release create android-test MallangMemo-android-test.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "말랑메모 안드로이드 (테스트)" --prerelease --latest=false \
              --notes "안드로이드 테스트 앱 (홈 화면 달력 위젯). 빌드 #${GITHUB_RUN_NUMBER}"
          fi
      # 확인용: 에뮬레이터에 설치해서 위젯 모습을 실제로 그려 캡처 (릴리스에 preview-*.png 로 같이 올림)
      # 위젯 데이터는 진짜 모바일 앱(docs/)을 열어서 앱이 넘기는 그대로 받음 (스킨 글꼴로 그린 제목·배경 포함)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 모바일 앱에서 위젯 데이터 받기
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i --no-save playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/pw/node_modules node android/preview/art.js preview-out
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 위젯 화면 캡처
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r MallangMemo-android-test.apk
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb shell settings put global hide_error_dialogs 1 || true
            sleep 5
            adb shell run-as com.woori.mallang mkdir -p files
            for f in preview-out/*.json; do n=$(basename $f); adb push $f /data/local/tmp/$n >/dev/null; adb shell "cat /data/local/tmp/$n | run-as com.woori.mallang sh -c 'cat > files/$n'"; done
            adb shell am start -S -W -n com.woori.mallang/.PreviewActivity --es file lav.json --ei h 400 ; sleep 4 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null ; sleep 1 ; adb exec-out screencap -p > preview-lav.png
            adb shell am start -S -W -n com.woori.mallang/.PreviewActivity --es file peach.json --ei off 1 --ei h 400 ; sleep 4 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null ; sleep 1 ; adb exec-out screencap -p > preview-next.png
            adb shell am start -S -W -n com.woori.mallang/.PreviewActivity --es file midnight.json --ei w 400 --ei h 680 ; sleep 4 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null ; sleep 1 ; adb exec-out screencap -p > preview-midnight.png
            adb shell am start -S -W -n com.woori.mallang/.PreviewActivity --es file draw.json --ei w 400 --ei h 680 ; sleep 4 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null ; sleep 1 ; adb exec-out screencap -p > preview-draw.png
            adb shell am start -S -W -n com.woori.mallang/.PreviewActivity --es file lav.json --ei w 400 --ei h 680 ; sleep 4 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null ; sleep 1 ; adb exec-out screencap -p > preview-big.png
            adb shell am start -S -W -n com.woori.mallang/.PreviewActivity --es file peach.json --ei w 400 --ei h 680 ; sleep 4 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null ; sleep 1 ; adb exec-out screencap -p > preview-bigpeach.png
            adb shell am start -S -W -n com.woori.mallang/.PreviewActivity --es file lav.json --ei w 260 --ei h 300 ; sleep 4 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null ; sleep 1 ; adb exec-out screencap -p > preview-small.png
            adb shell am start -S -W -n com.woori.mallang/.MainActivity --ez testUpdate true ; sleep 6 ; adb exec-out screencap -p > preview-update.png
            adb shell appops set com.woori.mallang REQUEST_INSTALL_PACKAGES allow ; python3 android/preview/tap.py "지금 받기" ; sleep 25 ; adb exec-out screencap -p > preview-install.png
            adb shell input keyevent KEYCODE_BACK ; sleep 1 ; adb shell input keyevent KEYCODE_BACK ; sleep 1
            adb shell am start -S -W -n com.woori.mallang/.PreviewActivity --es file lav-a45.json --ei h 400 --es wall 3D6E9E ; sleep 4 ; adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS >/dev/null ; sleep 1 ; adb exec-out screencap -p > preview-alpha.png
            ls -la preview-*.png
      - name: 캡처 올리기
        run: gh release upload android-test preview-lav.png preview-next.png preview-midnight.png preview-draw.png preview-big.png preview-bigpeach.png preview-small.png preview-alpha.png preview-update.png preview-install.png --repo "$GITHUB_REPOSITORY" --clobber
      - name: 실패 원인 남기기
        if: failure()
        working-directory: android
        run: |
          [ -f build.log ] || exit 0
          grep -E "error:|ERROR|FAILURE|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$(echo "$line" | cut -c1-300)"; done
