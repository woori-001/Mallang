# PC 앱 설치 파일을 만들어 Releases에 올립니다.
# desktop/package.json 의 version 과 같은 태그(예: v1.7.0)를 올리면 실행돼요.
# 설치된 PC 앱은 여기 올라온 새 버전을 찾아 자동으로 업데이트해요.
name: PC 앱 빌드·배포

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 태그와 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "package.json 버전(v$v)과 태그(${GITHUB_REF_NAME})가 달라요"; exit 1; fi
      - run: npm ci
      - name: 빌드하고 Releases에 올리기
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
