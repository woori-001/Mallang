# PC 앱 설치 파일을 만들어 Releases에 올립니다.
# desktop/package.json 의 version 을 올려서 main 에 푸시하면 실행돼요.
# 이미 올라간 버전이면 건너뛰어요. 설치된 PC 앱은 여기 올라온 새 버전을 찾아 자동으로 업데이트해요.
name: PC 앱 빌드·배포

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/release-pc.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pc
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: 이미 올라간 버전인지 확인
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v 는 이미 올라가 있어서 건너뛰어요"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: steps.ver.outputs.skip == 'false'
        run: npm ci
      - name: 빌드하고 Releases에 올리기
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          set -o pipefail
          npm run release 2>&1 | tee build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 실패 원인 남기기
        if: failure()
        shell: bash
        run: |
          tail -n 40 build.log | grep -v '^\s*$' | tail -n 25 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-300)"
          done
